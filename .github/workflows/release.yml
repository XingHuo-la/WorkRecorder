name: Release
on:
  push:
    tags:
      - 'v*' # 只有当你推送 v 开头的版本号时（比如 v1.0.1），才会触发自动打包

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]
    runs-on: ${{ matrix.platform }}
    
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Frontend Dependencies
        run: npm install

      - name: Build and Publish Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: '工作台版本 ${{ github.ref_name }}'
          # 更新提示里直接显示这一段（应用内「检查更新」读的就是 release body），
          # 所以写人话、写具体改了什么，别写「这是一个自动发布的增量更新」。
          releaseBody: |
            ### v1.1.7 · 让表更像个表

            **关联字段（新）**
            - 一列可以指向另一张表的一行：单元格显示对方标题，点开直达那条记录。
            - 单选 / 多条可配；对方被删掉时显示灰色「已删除」，不会静默变成空白。
            - 删行时同步摘掉同表里的引用；抽屉里新增「被引用于」，看得到谁指向它。

            **抽屉可以往回退了**
            - 从一条记录点进另一条之后，按 Esc 逐层退回上一条，退到底才关抽屉。
            - 抽屉里点「挂载的表」卡片直接跳到那张表。

            **字段值不再静默出问题**
            - 编辑单选/多选列时，自动把这一列已有的值补成选项 —— 不再凭空捏造「选项 A/B」。
            - 有值不在选项里时，单元格左上角一个红点：点它一键加为选项，或先放着。
            - 整列粘贴进单选/多选/日期列终于能用了（以前内容会跑进搜索框）。
            - 选项配色给了九色预设（七色 + 黑白），不用记色值。

            **定位与搜索**
            - Ctrl+K 搜到表格行，直接打开对应那张表并定位到那一行（以前只回到表格页）。

            **清理**
            - 预置表的自定义字段与单元格格式现在真的会存下来（以前刷新就没了）。
            - 删掉已下线的「完整录入 · 补录历史」入口及其表单。

            更新不会覆盖本地数据库。装完如果窗口没变化，彻底退出应用重开一次。
          releaseDraft: false
          prerelease: false