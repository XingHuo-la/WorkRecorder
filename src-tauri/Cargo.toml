[package]
name = "work_recorder"
version = "1.1.9"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "work_recorder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["protocol-asset", "devtools"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri-plugin-opener = "2"
chrono = "0.4"
tauri-plugin-dialog = "2.6.0"
tauri-plugin-process = "2"
rusqlite = { version = "0.31.0", features = ["bundled"] }
tauri-plugin-single-instance = "2"
# 剪贴板导入时要把 WPS 放在 kdocs 上的图下载回来（那些链接有时效，存 URL 等于没存）。
# reqwest 本来就在依赖树里（updater 拉的，默认 feature `rustls-tls` 已经给它开了
# `rustls-no-provider`），这里只显式用上它，不重复开 feature。
#
# ⚠️ 不要在 reqwest 上加 `rustls` feature：0.13 的 `rustls` 会带进 aws-lc-rs
# （锁文件里没有，还得现编 C）。TLS 由 updater 那条 `rustls-no-provider` 提供，
# provider 由下面的 rustls 依赖在下载命令里自己装（updater 只在检查更新时装，
# 指望不上）。
#
# ⚠️ `system-proxy` 必须显式开：reqwest 0.13 的**默认** feature 里含它（读 Windows
# 注册表 ProxyEnable / ProxyServer），而 updater 与本文件两边都写了 default-features
# = false，默认 feature 全被关掉 —— 结果用户在 Clash 里打开「系统代理」也没人看，
# 更新器只认 HTTPS_PROXY 环境变量（用户级注册表里又是空的），于是直连 github.com
# 被 RST（os error 10054），弹窗只剩一句「检查更新失败」。2026-11-28 实测：
# 不带环境变量 19.5s 后 10054；带 HTTPS_PROXY=127.0.0.1:7897 时 200 / 0.7s。
# 它只认 ProxyServer，不认 PAC（AutoConfigURL），也不认 socks5:// 写法的 ProxyServer。
reqwest = { version = "0.13", default-features = false, features = ["system-proxy"] }
# 只为了 install_default()：http 源直接下，https 源要有 provider 才能握手。
# 版本与 feature 跟 updater 那条保持一致（0.23 + ring），不引入新的编译单元。
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
